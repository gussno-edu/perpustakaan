<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perpustakaan Pragnyawacana — SMPN 4 Semin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --cream:#f6f1e4; --ink:#1f2a24; --green:#2f4a3d; --green-tint:#e4ebe5;
    --rust:#c1522c; --rust-tint:#fbe8de; --gold:#b98a2e; --gold-tint:#f3e7cd;
    --card:#ffffff; --muted:#6b7268; --line:#e4ddc9;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--cream); color:var(--ink); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;}
  .shell{max-width:720px; margin:0 auto; padding:32px 20px 70px;}

  header{padding-bottom:20px; margin-bottom:24px; display:flex; justify-content:space-between; align-items:flex-start;}
  .brand-label{font-family:'Inter', sans-serif; font-size:11px; font-weight:600; letter-spacing:0.04em; color:var(--green);
       background:var(--green-tint); border-radius:20px; padding:4px 12px; display:inline-block; margin-bottom:10px;}
  h1{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:28px; margin:0; line-height:1.1; letter-spacing:-0.01em;}
  h1 span{display:block; font-size:14px; font-weight:500; font-family:'Inter', sans-serif; color:var(--muted); margin-top:6px;}
  #profilRingkas{font-size:13px; text-align:right;}
  #profilRingkas b{display:block; font-weight:600;}
  #logoutBtn{background:none; border:none; color:var(--rust); font-weight:500; font-size:12px; cursor:pointer; padding:0; margin-top:4px;}

  /* ---- LOGIN SCREEN ---- */
  #loginScreen{background:var(--card); border-radius:20px; padding:36px 26px; text-align:center; box-shadow:0 1px 3px rgba(31,42,36,0.08);}
  #loginScreen h2{font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:22px; margin:0 0 8px;}
  #loginScreen p{font-size:14px; color:var(--muted); margin:0 0 22px;}
  #qrReader{max-width:280px; margin:0 auto 16px; border-radius:16px; overflow:hidden;}
  .or-divider{font-size:12px; color:var(--muted); margin:16px 0;}
  .login-manual{display:flex; gap:8px; max-width:320px; margin:0 auto;}
  .login-manual input{flex:1; font-size:15px; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; font-family:'Inter',sans-serif;}
  .login-manual button{padding:0 18px; background:var(--ink); color:var(--card); border:none; border-radius:12px; font-weight:600; cursor:pointer;}
  #loginStatus{font-size:13px; color:var(--rust); margin-top:12px;}

  /* ---- MAIN APP ---- */
  #appScreen{display:none;}
  .search-row{display:flex; gap:10px; margin-bottom:22px;}
  .search-row input{flex:1; font-size:16px; padding:13px 16px; border:1.5px solid var(--line); border-radius:14px; background:var(--card); font-family:'Inter',sans-serif;}
  .search-row button{padding:0 22px; background:var(--green); color:var(--card); border:none; border-radius:14px; font-weight:600; cursor:pointer;}

  .catalog{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:14px; margin-bottom:32px;}
  .card{background:var(--card); border-radius:16px; padding:18px; box-shadow:0 1px 3px rgba(31,42,36,0.06); position:relative;}
  .card h3{font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:16px; margin:0 0 4px; line-height:1.3;}
  .card .author{font-size:13px; color:var(--muted); margin-bottom:12px;}
  .stamp{font-family:'Inter', sans-serif; font-size:11px; font-weight:600; letter-spacing:0.01em;
         display:inline-block; padding:4px 11px; border-radius:20px; margin-bottom:10px;}
  .stamp.tersedia{color:var(--green); background:var(--green-tint);}
  .stamp.dipinjam{color:var(--rust); background:var(--rust-tint);}
  .card .aksi{display:flex; gap:6px; flex-wrap:wrap;}
  .card .aksi button{font-size:12.5px; font-weight:600; padding:7px 12px; border:none; border-radius:10px;
       background:var(--ink); color:var(--card); cursor:pointer;}
  .card .aksi button.secondary{background:var(--green-tint); color:var(--green);}

  #myLoansSection, #literasiSection{border-top:1.5px solid var(--line); padding-top:20px; margin-bottom:28px;}
  #myLoansSection h2, #literasiSection h2{font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:19px; margin:0 0 12px;}
  .loan-row{display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid #ece5d3; font-size:14px;}
  .loan-row .m{font-size:12px; color:var(--muted);}
  .late{color:var(--rust); font-weight:600;}

  .empty{font-size:13px; color:var(--muted); font-style:italic; padding:10px 0;}

  /* ---- LITERASI ---- */
  #resumeForm{background:var(--card); border-radius:16px; padding:18px; margin-bottom:18px; box-shadow:0 1px 3px rgba(31,42,36,0.06);}
  #resumeForm input, #resumeForm textarea{width:100%; font-size:15px; padding:12px 14px; border:1.5px solid var(--line);
       border-radius:12px; font-family:'Inter',sans-serif; margin-bottom:10px;}
  #resumeForm textarea{min-height:90px; resize:vertical;}
  #resumeForm button{padding:11px 20px; background:var(--green); color:var(--card); border:none; border-radius:12px; font-weight:600; cursor:pointer;}
  #resumeStatus{font-size:13px; margin-top:8px;}
  .resume-card{background:var(--card); border-radius:14px; padding:14px 16px; margin-bottom:10px; box-shadow:0 1px 3px rgba(31,42,36,0.05);}
  .resume-card .judul{font-weight:600; font-size:14px;}
  .resume-card .tgl{font-size:11.5px; color:var(--muted); margin-bottom:6px;}
  .resume-card .isi{font-size:13.5px; color:#3a3f3a; line-height:1.5;}
</style>
</head>
<body>
<div class="shell">

  <header>
    <div>
      <span class="brand-label">SMPN 4 SEMIN</span>
      <h1>Perpustakaan Pragnyawacana<span>Tuturan kebijaksanaan — cari dan pinjam buku</span></h1>
    </div>
    <div id="profilRingkas" style="display:none;">
      <b id="profilNama"></b>
      <span id="profilKelas"></span><br>
      <button id="logoutBtn" onclick="logout()">Keluar</button>
    </div>
  </header>

  <!-- ============ LOGIN ============ -->
  <div id="loginScreen">
    <h2>Masuk dulu, yuk</h2>
    <p>Scan QR di kartu pelajarmu, atau ketik NISN/NIP manual.</p>
    <div id="qrReader"></div>
    <button onclick="mulaiScan()" style="padding:10px 18px; background:var(--green); color:var(--card); border:none; font-weight:600; cursor:pointer;">Scan Kartu</button>
    <div class="or-divider">— atau —</div>
    <div class="login-manual">
      <input type="text" id="idManualInput" placeholder="NISN / NIP">
      <button onclick="loginManual()">Masuk</button>
    </div>
    <div id="loginStatus"></div>
  </div>

  <!-- ============ APP UTAMA ============ -->
  <div id="appScreen">

    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Cari judul atau penulis…">
      <button onclick="cariBuku()">Cari</button>
    </div>

    <div class="catalog" id="catalogResult"></div>

    <div id="myLoansSection">
      <h2>Pinjaman Saya</h2>
      <div id="myLoansResult"></div>
    </div>

    <div id="literasiSection">
      <h2>Literasi — Resume Bacaan</h2>
      <div id="resumeForm">
        <input type="text" id="resumeJudulInput" placeholder="Judul buku yang dibaca">
        <textarea id="resumeIsiInput" placeholder="Ceritakan ringkasan bacaanmu di sini…"></textarea>
        <button onclick="kirimResume()">Simpan Resume</button>
        <div id="resumeStatus"></div>
      </div>
      <div id="resumeList"></div>
    </div>

  </div>

</div>

<script>
  // GANTI dengan URL deployment PUBLIK Web App (yang aksesnya "Anyone")
  const API_URL = 'https://script.google.com/macros/s/AKfycbwUFa79Ep_fFhImDdD-nO5dqwA97pIJ9J90B9kl9pBRzojZfUhGy5ii-7gy8ZQ_tk7i_A/exec';

  let profil = null; // {idAnggota, nama, jenisAnggota, kelasJabatan}
  let html5QrCode = null;

  // ---------- Panggilan API (pakai trik text/plain biar tidak kena CORS preflight) ----------
  function apiPost(action, data) {
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...data }),
    }).then((r) => r.json());
  }
  function apiGet(action, params) {
    const qs = new URLSearchParams({ action, ...params }).toString();
    return fetch(`${API_URL}?${qs}`).then((r) => r.json());
  }

  // ---------- Sesi ringan lewat localStorage ----------
  function simpanSesi(p) {
    localStorage.setItem('perpus_profil', JSON.stringify(p));
  }
  function muatSesi() {
    const raw = localStorage.getItem('perpus_profil');
    return raw ? JSON.parse(raw) : null;
  }
  function logout() {
    localStorage.removeItem('perpus_profil');
    location.reload();
  }

  // ---------- Login ----------
  function mulaiScan() {
    const readerDiv = document.getElementById('qrReader');
    readerDiv.style.display = 'block';
    html5QrCode = new Html5Qrcode('qrReader');
    html5QrCode.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: 220 },
      (decodedText) => {
        html5QrCode.stop();
        readerDiv.style.display = 'none';
        prosesLogin(decodedText);
      }
    ).catch(() => {
      document.getElementById('loginStatus').textContent = 'Kamera tidak bisa diakses. Coba masukkan NISN manual.';
    });
  }

  function loginManual() {
    const id = document.getElementById('idManualInput').value.trim();
    if (!id) return;
    prosesLogin(id);
  }

  function prosesLogin(idAnggota) {
    document.getElementById('loginStatus').textContent = 'Memeriksa…';
    apiPost('login', { idAnggota }).then((res) => {
      if (!res.sukses) {
        document.getElementById('loginStatus').textContent = res.pesan;
        return;
      }
      profil = res.profil;
      simpanSesi(profil);
      tampilkanApp();
    });
  }

  // ---------- Tampilkan app utama setelah login ----------
  function tampilkanApp() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    document.getElementById('profilRingkas').style.display = 'block';
    document.getElementById('profilNama').textContent = profil.nama;
    document.getElementById('profilKelas').textContent = profil.kelasJabatan;
    muatPinjamanSaya();
    muatResumeSaya();
  }

  // ---------- Cari buku ----------
  function cariBuku() {
    const q = document.getElementById('searchInput').value.trim();
    apiGet('searchBooks', { q }).then((res) => renderKatalog(res.hasil));
  }

  function renderKatalog(daftar) {
    const el = document.getElementById('catalogResult');
    if (!daftar.length) {
      el.innerHTML = '<div class="empty">Tidak ada buku yang cocok.</div>';
      return;
    }
    el.innerHTML = daftar.map((b) => {
      const adaStok = b.tersedia > 0;
      const stampCls = adaStok ? 'tersedia' : 'dipinjam';
      const stampTxt = adaStok ? 'tersedia' : 'dipinjam semua';
      const judulAman = b.judul.replace(/'/g, "\\'");
      const aksiDigital = b.format === 'Digital'
        ? `<button onclick="unduhPdf('${b.judulGroup}')">Unduh PDF</button>` : '';
      return `
        <div class="card">
          <h3>${b.judul}</h3>
          <div class="author">${b.penulis}</div>
          <span class="stamp ${stampCls}">${stampTxt}</span>
          <div class="aksi">
            ${aksiDigital}
            <button class="secondary" onclick="isiJudulResume('${judulAman}')">Tulis Resume</button>
          </div>
        </div>`;
    }).join('');
  }

  function isiJudulResume(judul) {
    document.getElementById('resumeJudulInput').value = judul;
    document.getElementById('literasiSection').scrollIntoView({ behavior: 'smooth' });
    document.getElementById('resumeIsiInput').focus();
  }

  // ---------- Pinjaman saya ----------
  function muatPinjamanSaya() {
    apiPost('myLoans', { idAnggota: profil.idAnggota }).then((res) => {
      const el = document.getElementById('myLoansResult');
      if (!res.pinjaman.length) {
        el.innerHTML = '<div class="empty">Belum ada pinjaman aktif.</div>';
        return;
      }
      el.innerHTML = res.pinjaman.map((p) => `
        <div class="loan-row">
          <div>
            <div>${p.judul}</div>
            <div class="m">Dipinjam ${p.tanggalPinjam ? new Date(p.tanggalPinjam).toLocaleDateString('id-ID') : '-'}</div>
          </div>
          <div class="m ${p.status === 'Terlambat' ? 'late' : ''}">
            ${p.jenisPinjam === 'Digital (PDF)' ? 'Digital' :
              (p.status === 'Terlambat' ? 'Terlambat' : `Jatuh tempo ${new Date(p.tanggalJatuhTempo).toLocaleDateString('id-ID')}`)}
          </div>
        </div>`).join('');
    });
  }

  // ---------- Unduh PDF (digital) ----------
  function unduhPdf(judulGroup) {
    // judulGroup di sini dipakai sekadar penanda; ID_Buku sebenarnya
    // didapat dari hasil pencarian per-eksemplar. Untuk koleksi digital
    // biasanya cuma 1 eksemplar per judul, jadi pemetaan judulGroup -> idBuku
    // bisa disederhanakan di sisi backend bila perlu (idAnggota tetap wajib).
    apiPost('ajukanUnduhPdf', { idAnggota: profil.idAnggota, idBuku: judulGroup }).then((res) => {
      if (!res.sukses) { alert(res.error || 'Gagal mengunduh.'); return; }
      window.open(res.urlUnduh, '_blank');
      muatPinjamanSaya();
    });
  }

  // ---------- Literasi: resume bacaan ----------
  function kirimResume() {
    const judul = document.getElementById('resumeJudulInput').value.trim();
    const ringkasan = document.getElementById('resumeIsiInput').value.trim();
    const statusDiv = document.getElementById('resumeStatus');
    if (!judul || !ringkasan) {
      statusDiv.innerHTML = '<span style="color:var(--rust);">Judul dan ringkasan wajib diisi.</span>';
      return;
    }
    statusDiv.innerHTML = 'Menyimpan…';
    apiPost('tambahResume', { idAnggota: profil.idAnggota, judulBuku: judul, ringkasan }).then((res) => {
      if (!res.sukses) { statusDiv.innerHTML = `<span style="color:var(--rust);">${res.error || 'Gagal menyimpan.'}</span>`; return; }
      document.getElementById('resumeJudulInput').value = '';
      document.getElementById('resumeIsiInput').value = '';
      statusDiv.innerHTML = '<span style="color:var(--green);">Resume tersimpan. Terus baca, ya!</span>';
      muatResumeSaya();
    });
  }

  function muatResumeSaya() {
    apiPost('getResumeSaya', { idAnggota: profil.idAnggota }).then((res) => {
      const el = document.getElementById('resumeList');
      if (!res.resume.length) {
        el.innerHTML = '<div class="empty">Belum ada resume yang ditulis.</div>';
        return;
      }
      el.innerHTML = res.resume.map((r) => `
        <div class="resume-card">
          <div class="judul">${r.judulBuku}</div>
          <div class="tgl">${r.tanggal ? new Date(r.tanggal).toLocaleDateString('id-ID') : ''}</div>
          <div class="isi">${r.ringkasan}</div>
        </div>`).join('');
    });
  }

  // ---------- Inisialisasi ----------
  (function init() {
    const sesi = muatSesi();
    if (sesi) {
      profil = sesi;
      tampilkanApp();
    }
  })();
</script>
</body>
</html>
